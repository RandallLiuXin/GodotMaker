name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

env:
  PYTHON_VERSION: "3.12"

jobs:
  # A family that advertises a runtime delivery it can never register looks
  # identical to a working one from inside a game project: the asset simply
  # never reaches a worker. A tracked gap may live on main under its upstream
  # issue; it may not reach a tag.
  asset-family-closure:
    name: Asset Family Closure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: python tools/asset_family_registry.py --check --require-closed

  release:
    name: Create GitHub Release
    needs: asset-family-closure
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/v}" >> $GITHUB_OUTPUT

      - name: Extract release notes
        run: |
          VERSION="${{ steps.version.outputs.VERSION }}"
          NOTES_FILE="docs/update/v${VERSION}.md"

          if [ -f "$NOTES_FILE" ]; then
            cp "$NOTES_FILE" /tmp/release_notes.md
          else
            echo "Release v${VERSION}" > /tmp/release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release_notes.md
